<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmacia — Huellitas de Amor</title>
<link rel="icon" type="image/x-icon" href="../iconos/Huellitas-de-Amor-Pet-Silhouette-Logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/panel.css?v=dbcb3001c5">
</head>
<body>

<div class="panel" id="panel">
  <aside class="barra-lateral" id="barraLateral"></aside>
  <div class="velo-menu" id="veloMenu"></div>

  <main class="contenido">
    <header class="contenido-cabecera">
      <div>
        <button class="abrir-menu" id="abrirMenu" aria-label="Abrir menú">☰</button>
        <h1>Farmacia</h1>
        <p>La receta es lo que firma el veterinario; la dispensación es lo que sale del estante.</p>
      </div>
    </header>

    <div class="pestanas" id="pestanas">
      <button type="button" class="activa" data-pestana="recetas">Recetas</button>
      <button type="button" data-pestana="dispensaciones">Dispensaciones</button>
      <button type="button" data-pestana="inventario">Inventario</button>
      <button type="button" data-pestana="interacciones">Interacciones</button>
      <button type="button" data-pestana="restringidos">Control especial</button>
    </div>

    <section class="tarjeta">
      <div id="contenido"></div>
    </section>
  </main>
</div>

<!-- Dispensar una receta -->
<div class="modal-fondo" id="modalDispensar" aria-hidden="true">
  <div class="modal-caja modal-ancho" role="dialog" aria-modal="true">
    <button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <h3 id="tituloDispensar">Dispensar</h3>
    <p class="modal-sub" id="subDispensar"></p>

    <p class="mensaje-error" id="errorDispensar" hidden></p>

    <div id="cuerpoDispensar"></div>
  </div>
</div>

<script src="../js/sprite.js?v=dbcb3001c5"></script>
<script src="../js/api.js?v=dbcb3001c5"></script>
<script src="../js/panel.js?v=dbcb3001c5"></script>
<script src="../js/admin-farmacia.js?v=dbcb3001c5"></script>
</body>
</html>

# Corre en cada push y en cada pull request: si algo se rompe, el PR lo
# muestra en rojo antes de fusionarlo.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      # Falla el PR si una dependencia de producción tiene una vulnerabilidad
      # crítica conocida, para que se vea en el PR y no al desplegar.
      #
      # El umbral es "critical" y no "high" (el de `npm run auditar`) solo
      # mientras se migra zod 3 → 4: la alerta alta de zod pide un salto de
      # versión mayor que cambia los mensajes de error de los esquemas, y va
      # en su propio PR. Al cerrarlo, subir esto a --audit-level=high.
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=critical

      - name: Linter
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      # PostgreSQL en memoria (PGlite): no necesita Supabase ni secretos.
      - name: Pruebas de integración
        run: npm run test:integracion

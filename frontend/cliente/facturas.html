<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis facturas — Huellitas de Amor</title>
<link rel="icon" type="image/x-icon" href="../iconos/Huellitas-de-Amor-Pet-Silhouette-Logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/panel.css?v=dbcb3001c5">
</head>
<body>

<div class="panel" id="panel">
  <aside class="barra-lateral" id="barraLateral"></aside>
  <div class="velo-menu" id="veloMenu"></div>

  <main class="contenido">
    <header class="contenido-cabecera">
      <div>
        <button class="abrir-menu" id="abrirMenu" aria-label="Abrir menú">☰</button>
        <h1>Mis facturas</h1>
        <p>Lo que has pagado y lo que queda pendiente en la clínica.</p>
      </div>
    </header>

    <section class="tarjeta" id="resumenCartera"></section>

    <section class="tarjeta">
      <div class="tarjeta-cabecera">
        <h3><svg class="icon"><use href="#icon-recibo"/></svg> Historial</h3>
        <label class="campo" style="margin:0;min-width:190px">
          <select id="filtroEstado">
            <option value="">Todas</option>
            <option value="pendiente">Pendientes</option>
            <option value="parcial">Con abono</option>
            <option value="pagada">Pagadas</option>
          </select>
        </label>
      </div>
      <div id="listaFacturas"></div>
    </section>
  </main>
</div>

<div class="modal-fondo" id="modalFactura" aria-hidden="true">
  <div class="modal-caja" role="dialog" aria-modal="true">
    <button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <div id="detalleFactura"></div>
  </div>
</div>

<script src="../js/sprite.js?v=dbcb3001c5"></script>
<script src="../js/api.js?v=dbcb3001c5"></script>
<script src="../js/panel.js?v=dbcb3001c5"></script>
<script src="../js/factura-ui.js?v=dbcb3001c5"></script>
<script src="../js/cliente-facturas.js?v=dbcb3001c5"></script>
</body>
</html>

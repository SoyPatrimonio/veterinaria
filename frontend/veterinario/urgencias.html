<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urgencias — Huellitas de Amor</title>
<link rel="icon" type="image/x-icon" href="../iconos/Huellitas-de-Amor-Pet-Silhouette-Logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/panel.css?v=dbcb3001c5">
</head>
<body>

<div class="panel" id="panel">
  <aside class="barra-lateral" id="barraLateral"></aside>
  <div class="velo-menu" id="veloMenu"></div>

  <main class="contenido">
    <header class="contenido-cabecera">
      <div>
        <button class="abrir-menu" id="abrirMenu" aria-label="Abrir menú">☰</button>
        <h1>Urgencias</h1>
        <p>La sala se ordena por gravedad, no por orden de llegada.</p>
      </div>
      <button type="button" class="btn btn-primary" id="btnLlegada">
        <svg class="icon"><use href="#icon-mas"/></svg> Registrar llegada
      </button>
    </header>

    <section class="rejilla-metricas" id="metricas"></section>

    <section class="tarjeta">
      <div class="tarjeta-cabecera">
        <h3>Pacientes en sala</h3>
        <p class="campo-ayuda" id="ultimaActualizacion"></p>
      </div>
      <div id="listaUrgencias"></div>
    </section>
  </main>
</div>

<!-- Registrar llegada -->
<div class="modal-fondo" id="modalLlegada" aria-hidden="true">
  <div class="modal-caja" role="dialog" aria-modal="true">
    <button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <h3>Registrar llegada</h3>
    <p class="modal-sub">La prioridad se asigna después, en el triage.</p>

    <p class="mensaje-error" id="errorLlegada" hidden></p>

    <form id="formLlegada" novalidate>
      <label class="campo">
        <span>Paciente *</span>
        <select name="mascotaId" required>
          <option value="">Buscando pacientes…</option>
        </select>
        <small class="campo-ayuda">Si es la primera vez que viene, regístralo antes en Pacientes.</small>
      </label>

      <div class="campos-fila">
        <label class="campo">
          <span>Sala</span>
          <select name="salaId"><option value="">Sin asignar</option></select>
        </label>
        <label class="campo">
          <span>Veterinario responsable</span>
          <select name="veterinarioId"><option value="">Sin asignar</option></select>
        </label>
      </div>

      <label class="campo">
        <span>Motivo de consulta *</span>
        <input type="text" name="motivo" required maxlength="255"
               placeholder="Atropellamiento, vómito con sangre, dificultad respiratoria…">
      </label>

      <div class="modal-acciones">
        <button type="button" class="btn btn-outline" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnGuardarLlegada">Registrar</button>
      </div>
    </form>
  </div>
</div>

<!-- Triage -->
<div class="modal-fondo" id="modalTriage" aria-hidden="true">
  <div class="modal-caja" role="dialog" aria-modal="true">
    <button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <h3 id="tituloTriage">Triage</h3>
    <p class="modal-sub">Rojo se atiende de inmediato; azul puede esperar.</p>

    <p class="mensaje-error" id="errorTriage" hidden></p>

    <form id="formTriage" novalidate>
      <input type="hidden" name="id">

      <div class="campo">
        <span>Prioridad *</span>
        <div class="opciones" id="opcionesPrioridad"></div>
      </div>

      <div class="campos-fila">
        <label class="campo">
          <span>Sala</span>
          <select name="salaId"><option value="">Sin asignar</option></select>
        </label>
        <label class="campo">
          <span>Veterinario responsable</span>
          <select name="veterinarioId"><option value="">Sin asignar</option></select>
        </label>
      </div>

      <label class="campo">
        <span>Hallazgos del triage</span>
        <textarea name="hallazgos" maxlength="4000"
                  placeholder="Estado de conciencia, mucosas, pulso, dificultad respiratoria…"></textarea>
      </label>

      <div class="modal-acciones">
        <button type="button" class="btn btn-outline" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnGuardarTriage">Guardar triage</button>
      </div>
    </form>
  </div>
</div>

<!-- Detalle: línea de tiempo de la emergencia -->
<div class="modal-fondo" id="modalDetalle" aria-hidden="true">
  <div class="modal-caja modal-ancho" role="dialog" aria-modal="true">
    <button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <h3 id="tituloDetalle">Atención</h3>
    <p class="modal-sub" id="subDetalle"></p>

    <div class="pestanas" id="pestanasDetalle">
      <button type="button" class="activa" data-pestana="tiempo">Línea de tiempo</button>
      <button type="button" data-pestana="signos">Signos vitales</button>
      <button type="button" data-pestana="medicacion">Medicación</button>
      <button type="button" data-pestana="cierre">Alta o ingreso</button>
    </div>

    <p class="mensaje-error" id="errorDetalle" hidden></p>

    <div id="cuerpoDetalle"></div>
  </div>
</div>

<script src="../js/sprite.js?v=dbcb3001c5"></script>
<script src="../js/api.js?v=dbcb3001c5"></script>
<script src="../js/panel.js?v=dbcb3001c5"></script>
<script src="../js/vet-urgencias.js?v=dbcb3001c5"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veterinarios — Administración</title>
<link rel="icon" type="image/x-icon" href="../iconos/Huellitas-de-Amor-Pet-Silhouette-Logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/panel.css?v=dbcb3001c5">
</head>
<body>

<div class="panel" id="panel">
  <aside class="barra-lateral" id="barraLateral"></aside>
  <div class="velo-menu" id="veloMenu"></div>

  <main class="contenido">
    <header class="contenido-cabecera">
      <div>
        <button class="abrir-menu" id="abrirMenu" aria-label="Abrir menú">☰</button>
        <h1>Veterinarios</h1>
        <p>Al crear un veterinario se genera también su cuenta de acceso al panel.</p>
      </div>
      <button type="button" class="btn btn-primary" id="btnNuevo">
        <svg class="icon"><use href="#icon-mas"/></svg> Registrar veterinario
      </button>
    </header>

    <section class="tarjeta">
      <div id="listaVeterinarios"></div>
    </section>
  </main>
</div>

<!-- Alta -->
<div class="modal-fondo" id="modalNuevo" aria-hidden="true">
  <div class="modal-caja" role="dialog" aria-modal="true">
    <button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <h3>Registrar veterinario</h3>
    <p class="modal-sub">Se crea la cuenta con rol veterinario y su ficha profesional.</p>

    <p class="mensaje-error" id="errorNuevo" hidden></p>

    <form id="formNuevo" novalidate>
      <label class="campo">
        <span>Nombre completo *</span>
        <input type="text" name="nombre" required maxlength="120" placeholder="Dra. Valentina Ríos">
      </label>

      <div class="campos-fila">
        <label class="campo">
          <span>Correo *</span>
          <input type="email" name="email" required>
        </label>
        <label class="campo">
          <span>Teléfono</span>
          <input type="tel" name="telefono" maxlength="30">
        </label>
      </div>

      <div class="campos-fila">
        <label class="campo">
          <span>Número de licencia *</span>
          <input type="text" name="licencia" required maxlength="40" placeholder="MV-10432">
        </label>
        <label class="campo">
          <span>Especialidad *</span>
          <select name="especialidad" required>
            <option value="medicina_general">Medicina general</option>
            <option value="cirugia">Cirugía</option>
            <option value="dermatologia">Dermatología</option>
            <option value="cardiologia">Cardiología</option>
            <option value="odontologia">Odontología</option>
            <option value="exoticos">Animales exóticos</option>
            <option value="imagenes">Diagnóstico por imágenes</option>
            <option value="felinos">Medicina felina</option>
          </select>
        </label>
      </div>

      <div class="campos-fila">
        <label class="campo">
          <span>Contraseña inicial *</span>
          <input type="password" name="password" required autocomplete="new-password">
          <span class="campo-ayuda">Mínimo 8 caracteres, con letra y número.</span>
        </label>
        <label class="campo">
          <span>Duración de cada turno</span>
          <select name="duracionSlotMin">
            <option value="20">20 minutos</option>
            <option value="30" selected>30 minutos</option>
            <option value="45">45 minutos</option>
            <option value="60">60 minutos</option>
          </select>
        </label>
      </div>

      <label class="campo">
        <span>Descripción</span>
        <textarea name="descripcion" maxlength="1000" placeholder="Experiencia, áreas de interés…"></textarea>
      </label>

      <div class="modal-acciones">
        <button type="button" class="btn btn-outline" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnGuardarNuevo">Registrar</button>
      </div>
    </form>
  </div>
</div>

<!-- Edición -->
<div class="modal-fondo" id="modalEditar" aria-hidden="true">
  <div class="modal-caja" role="dialog" aria-modal="true">
    <button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <h3 id="tituloEditar">Editar veterinario</h3>
    <p class="modal-sub">El correo y la licencia no se modifican desde aquí.</p>

    <p class="mensaje-error" id="errorEditar" hidden></p>

    <form id="formEditar" novalidate>
      <input type="hidden" name="id">

      <label class="campo">
        <span>Nombre completo *</span>
        <input type="text" name="nombre" required maxlength="120">
      </label>

      <div class="campos-fila">
        <label class="campo">
          <span>Teléfono</span>
          <input type="tel" name="telefono" maxlength="30">
        </label>
        <label class="campo">
          <span>Especialidad *</span>
          <select name="especialidad" required>
            <option value="medicina_general">Medicina general</option>
            <option value="cirugia">Cirugía</option>
            <option value="dermatologia">Dermatología</option>
            <option value="cardiologia">Cardiología</option>
            <option value="odontologia">Odontología</option>
            <option value="exoticos">Animales exóticos</option>
            <option value="imagenes">Diagnóstico por imágenes</option>
            <option value="felinos">Medicina felina</option>
          </select>
        </label>
      </div>

      <div class="campos-fila">
        <label class="campo">
          <span>Duración de cada turno</span>
          <select name="duracionSlotMin">
            <option value="20">20 minutos</option>
            <option value="30">30 minutos</option>
            <option value="45">45 minutos</option>
            <option value="60">60 minutos</option>
          </select>
        </label>
        <label class="campo">
          <span>Estado</span>
          <select name="activo">
            <option value="1">Activo</option>
            <option value="0">Inactivo</option>
          </select>
        </label>
      </div>

      <label class="campo">
        <span>Descripción</span>
        <textarea name="descripcion" maxlength="1000"></textarea>
      </label>

      <div class="modal-acciones">
        <button type="button" class="btn btn-outline" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnGuardarEditar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/sprite.js?v=dbcb3001c5"></script>
<script src="../js/api.js?v=dbcb3001c5"></script>
<script src="../js/panel.js?v=dbcb3001c5"></script>
<script src="../js/admin-veterinarios.js?v=dbcb3001c5"></script>
</body>
</html>

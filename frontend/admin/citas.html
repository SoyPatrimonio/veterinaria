<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citas — Administración</title>
<link rel="icon" type="image/x-icon" href="../iconos/Huellitas-de-Amor-Pet-Silhouette-Logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/panel.css?v=dbcb3001c5">
</head>
<body>

<div class="panel" id="panel">
  <aside class="barra-lateral" id="barraLateral"></aside>
  <div class="velo-menu" id="veloMenu"></div>

  <main class="contenido">
    <header class="contenido-cabecera">
      <div>
        <button class="abrir-menu" id="abrirMenu" aria-label="Abrir menú">☰</button>
        <h1>Citas de la clínica</h1>
        <p>Filtra por rango de fechas, veterinario o estado.</p>
      </div>
    </header>

    <section class="tarjeta">
      <div class="agenda-controles">
        <label class="campo" style="margin:0">
          <span>Desde</span>
          <input type="date" id="inputDesde">
        </label>
        <label class="campo" style="margin:0">
          <span>Hasta</span>
          <input type="date" id="inputHasta">
        </label>
        <label class="campo" style="margin:0;min-width:180px">
          <span>Veterinario</span>
          <select id="filtroVeterinario"><option value="">Todos</option></select>
        </label>
        <label class="campo" style="margin:0;min-width:160px">
          <span>Estado</span>
          <select id="filtroEstado">
            <option value="">Todos</option>
            <option value="pendiente">Pendientes</option>
            <option value="confirmada">Confirmadas</option>
            <option value="atendida">Atendidas</option>
            <option value="cancelada">Canceladas</option>
            <option value="no_asistio">No asistió</option>
          </select>
        </label>
        <button type="button" class="btn btn-moss" id="btnFiltrar">Aplicar</button>
      </div>
    </section>

    <section class="tarjeta">
      <div class="tarjeta-cabecera">
        <h2><svg class="icon"><use href="#icon-calendar"/></svg> Resultados</h2>
        <span class="campo-ayuda" id="contador"></span>
      </div>
      <div id="listaCitas"></div>
    </section>
  </main>
</div>

<script src="../js/sprite.js?v=dbcb3001c5"></script>
<script src="../js/api.js?v=dbcb3001c5"></script>
<script src="../js/panel.js?v=dbcb3001c5"></script>
<script src="../js/admin-citas.js?v=dbcb3001c5"></script>
</body>
</html>

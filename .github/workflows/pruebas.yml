# Corre en cada push y en cada pull request: si algo se rompe, el PR lo
# muestra en rojo antes de fusionarlo.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci

      # Falla el PR si una dependencia de producción tiene una vulnerabilidad
      # alta o crítica conocida. Es el mismo umbral que `npm run auditar`, que
      # corre antes de cada deploy: así se ve en el PR y no al desplegar.
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

      - name: Linter
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      # PostgreSQL en memoria (PGlite): no necesita Supabase ni secretos.
      - name: Pruebas de integración
        run: npm run test:integracion

      # Las mismas, conectadas como huellitas_app (migracion-rol-app.sql).
      # Si un cambio necesita un permiso que ese rol no tiene, falla aquí y
      # no en producción.
      - name: Pruebas de integración con el rol de la aplicación
        run: npm run test:integracion:rol

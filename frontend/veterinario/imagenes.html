<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagenología — Huellitas de Amor</title>
<link rel="icon" type="image/x-icon" href="../iconos/Huellitas-de-Amor-Pet-Silhouette-Logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/panel.css?v=dbcb3001c5">
</head>
<body>

<div class="panel" id="panel">
  <aside class="barra-lateral" id="barraLateral"></aside>
  <div class="velo-menu" id="veloMenu"></div>

  <main class="contenido">
    <header class="contenido-cabecera">
      <div>
        <button class="abrir-menu" id="abrirMenu" aria-label="Abrir menú">☰</button>
        <h1>Imagenología</h1>
        <p>Radiografías, ecografías y fotografías clínicas, con su informe firmado.</p>
      </div>
      <button type="button" class="btn btn-primary" id="btnNuevo">
        <svg class="icon"><use href="#icon-mas"/></svg> Nuevo estudio
      </button>
    </header>

    <section class="tarjeta">
      <div class="tarjeta-cabecera">
        <h3>Estudios</h3>
        <div class="agenda-controles">
          <label class="campo">
            <span>Modalidad</span>
            <select id="filtroModalidad">
              <option value="">Todas</option>
              <option value="radiografia">Radiografía</option>
              <option value="ecografia">Ecografía</option>
              <option value="tomografia">Tomografía</option>
              <option value="endoscopia">Endoscopia</option>
              <option value="fotografia">Fotografía clínica</option>
            </select>
          </label>
          <label class="campo">
            <span>Estado</span>
            <select id="filtroEstado">
              <option value="">Todos</option>
              <option value="realizado">Sin informar</option>
              <option value="informado">Informados</option>
              <option value="anulado">Anulados</option>
            </select>
          </label>
        </div>
      </div>
      <div id="listaEstudios"></div>
    </section>
  </main>
</div>

<!-- Nuevo estudio -->
<div class="modal-fondo" id="modalEstudio" aria-hidden="true">
  <div class="modal-caja" role="dialog" aria-modal="true">
    <button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <h3>Nuevo estudio</h3>
    <p class="modal-sub">Los archivos se adjuntan después, al abrir el estudio.</p>

    <p class="mensaje-error" id="errorEstudio" hidden></p>

    <form id="formEstudio" novalidate>
      <label class="campo">
        <span>Paciente *</span>
        <select name="mascotaId" required><option value="">Cargando…</option></select>
      </label>

      <div class="campos-fila">
        <label class="campo">
          <span>Modalidad *</span>
          <select name="modalidad" required>
            <option value="radiografia">Radiografía</option>
            <option value="ecografia">Ecografía</option>
            <option value="tomografia">Tomografía</option>
            <option value="endoscopia">Endoscopia</option>
            <option value="fotografia">Fotografía clínica</option>
          </select>
        </label>
        <label class="campo">
          <span>Equipo</span>
          <select name="equipoId"><option value="">Sin registrar</option></select>
        </label>
      </div>

      <div class="campos-fila">
        <label class="campo">
          <span>Región</span>
          <input type="text" name="region" maxlength="80" placeholder="Tórax, abdomen, cadera…">
        </label>
        <label class="campo">
          <span>Proyección</span>
          <input type="text" name="proyeccion" maxlength="60" placeholder="Ventrodorsal, lateral derecha…">
        </label>
      </div>

      <label class="campo-check"><input type="checkbox" name="sedacion"> Requirió sedación</label>

      <label class="campo">
        <span>Indicación</span>
        <textarea name="indicacion" maxlength="2000" placeholder="Por qué se pide el estudio."></textarea>
      </label>

      <div class="modal-acciones">
        <button type="button" class="btn btn-outline" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnGuardarEstudio">Registrar</button>
      </div>
    </form>
  </div>
</div>

<!-- Detalle: galería e informe -->
<div class="modal-fondo" id="modalDetalle" aria-hidden="true">
  <div class="modal-caja modal-ancho" role="dialog" aria-modal="true">
    <button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <h3 id="tituloDetalle">Estudio</h3>
    <p class="modal-sub" id="subDetalle"></p>

    <p class="mensaje-error" id="errorDetalle" hidden></p>

    <div id="cuerpoDetalle"></div>
  </div>
</div>

<script src="../js/sprite.js?v=dbcb3001c5"></script>
<script src="../js/api.js?v=dbcb3001c5"></script>
<script src="../js/panel.js?v=dbcb3001c5"></script>
<script src="../js/vet-imagenes.js?v=dbcb3001c5"></script>
</body>
</html>

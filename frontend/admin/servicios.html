<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicios — Administración</title>
<link rel="icon" type="image/x-icon" href="../iconos/Huellitas-de-Amor-Pet-Silhouette-Logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/panel.css?v=dbcb3001c5">
</head>
<body>

<div class="panel" id="panel">
  <aside class="barra-lateral" id="barraLateral"></aside>
  <div class="velo-menu" id="veloMenu"></div>

  <main class="contenido">
    <header class="contenido-cabecera">
      <div>
        <button class="abrir-menu" id="abrirMenu" aria-label="Abrir menú">☰</button>
        <h1>Servicios</h1>
        <p>La duración de cada servicio define el tamaño del bloque que ocupa en la agenda.</p>
      </div>
      <button type="button" class="btn btn-primary" id="btnNuevo">
        <svg class="icon"><use href="#icon-mas"/></svg> Nuevo servicio
      </button>
    </header>

    <section class="tarjeta">
      <div id="listaServicios"></div>
    </section>
  </main>
</div>

<div class="modal-fondo" id="modalServicio" aria-hidden="true">
  <div class="modal-caja" role="dialog" aria-modal="true">
    <button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">✕</button>
    <h3 id="tituloServicio">Nuevo servicio</h3>
    <p class="modal-sub">Si no marcas ningún veterinario, el servicio queda abierto a todo el equipo.</p>

    <p class="mensaje-error" id="errorServicio" hidden></p>

    <form id="formServicio" novalidate>
      <input type="hidden" name="id">

      <label class="campo">
        <span>Nombre *</span>
        <input type="text" name="nombre" required maxlength="100" placeholder="Consulta veterinaria">
      </label>

      <div class="campos-fila-3">
        <label class="campo">
          <span>Precio (COP) *</span>
          <input type="number" name="precio" min="0" step="1000" required value="0">
        </label>
        <label class="campo">
          <span>Duración (min) *</span>
          <input type="number" name="duracionMin" min="5" max="480" step="5" required value="30">
        </label>
        <label class="campo">
          <span>Estado</span>
          <select name="activo">
            <option value="1">Activo</option>
            <option value="0">Inactivo</option>
          </select>
        </label>
      </div>

      <label class="campo">
        <span>Descripción</span>
        <textarea name="descripcion" maxlength="2000"></textarea>
      </label>

      <label class="campo">
        <span>Requisitos</span>
        <input type="text" name="requisitos" maxlength="1000" placeholder="Ayuno de 8 horas, carné de vacunación…">
      </label>

      <div class="campo">
        <span>Veterinarios que lo atienden</span>
        <div id="listaCheckVets" style="display:grid;gap:7px;margin-top:6px"></div>
      </div>

      <div class="modal-acciones">
        <button type="button" class="btn btn-outline" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnGuardarServicio">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/sprite.js?v=dbcb3001c5"></script>
<script src="../js/api.js?v=dbcb3001c5"></script>
<script src="../js/panel.js?v=dbcb3001c5"></script>
<script src="../js/admin-servicios.js?v=dbcb3001c5"></script>
</body>
</html>

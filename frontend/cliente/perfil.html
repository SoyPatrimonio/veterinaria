<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — Huellitas de Amor</title>
<link rel="icon" type="image/x-icon" href="../iconos/Huellitas-de-Amor-Pet-Silhouette-Logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/panel.css?v=dbcb3001c5">
</head>
<body>

<div class="panel" id="panel">
  <aside class="barra-lateral" id="barraLateral"></aside>
  <div class="velo-menu" id="veloMenu"></div>

  <main class="contenido">
    <header class="contenido-cabecera">
      <div>
        <button class="abrir-menu" id="abrirMenu" aria-label="Abrir menú">☰</button>
        <h1>Mi perfil</h1>
        <p>Mantén tus datos de contacto al día para poder avisarte de cada cita.</p>
      </div>
    </header>

    <div class="rejilla-2">
      <section class="tarjeta">
        <div class="tarjeta-cabecera"><h2><svg class="icon"><use href="#icon-user"/></svg> Datos personales</h2></div>

        <p class="mensaje-error" id="errorPerfil" hidden></p>
        <p class="mensaje-ok" id="okPerfil" hidden></p>

        <form id="formPerfil" novalidate>
          <label class="campo">
            <span>Nombre completo *</span>
            <input type="text" name="nombre" required maxlength="120">
          </label>

          <div class="campos-fila">
            <label class="campo">
              <span>Correo electrónico</span>
              <input type="email" name="email" disabled>
              <span class="campo-ayuda">El correo identifica tu cuenta y no se puede cambiar aquí.</span>
            </label>
            <label class="campo">
              <span>Teléfono</span>
              <input type="tel" name="telefono" maxlength="30" placeholder="300 123 4567">
            </label>
          </div>

          <div class="campos-fila">
            <label class="campo">
              <span>Documento</span>
              <input type="text" name="documento" maxlength="30">
            </label>
            <label class="campo">
              <span>Ciudad</span>
              <input type="text" name="ciudad" maxlength="80">
            </label>
          </div>

          <label class="campo">
            <span>Dirección</span>
            <input type="text" name="direccion" maxlength="180">
          </label>

          <button type="submit" class="btn btn-primary" id="btnGuardarPerfil">Guardar cambios</button>
        </form>
      </section>

      <section class="tarjeta">
        <div class="tarjeta-cabecera"><h2><svg class="icon"><use href="#icon-shield"/></svg> Contraseña</h2></div>

        <p class="mensaje-error" id="errorPassword" hidden></p>
        <p class="mensaje-ok" id="okPassword" hidden></p>

        <form id="formPassword" novalidate>
          <label class="campo">
            <span>Contraseña actual *</span>
            <input type="password" name="actual" autocomplete="current-password" required>
          </label>
          <label class="campo">
            <span>Contraseña nueva *</span>
            <input type="password" name="nueva" autocomplete="new-password" required>
            <span class="campo-ayuda">Al menos 8 caracteres, con una letra y un número.</span>
          </label>
          <label class="campo">
            <span>Repite la contraseña nueva *</span>
            <input type="password" name="nueva2" autocomplete="new-password" required>
          </label>

          <button type="submit" class="btn btn-moss" id="btnCambiarPassword">Cambiar contraseña</button>
        </form>
      </section>
    </div>
  </main>
</div>

<script src="../js/sprite.js?v=dbcb3001c5"></script>
<script src="../js/api.js?v=dbcb3001c5"></script>
<script src="../js/panel.js?v=dbcb3001c5"></script>
<script src="../js/cliente-perfil.js?v=dbcb3001c5"></script>
</body>
</html>

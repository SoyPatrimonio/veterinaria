<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A2620">
<meta name="robots" content="noindex">
<title>Página no encontrada — Huellitas de Amor</title>
<link rel="icon" type="image/svg+xml" href="/iconos/app.svg">
<!-- Rutas absolutas: esta página responde a cualquier dirección que no
     exista, a cualquier profundidad. -->
<link rel="stylesheet" href="/css/panel.css">
<style>
  .no-existe{ min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center; }
  .no-existe-caja{ max-width: 440px; }
  .no-existe img{ width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 20px; box-shadow: var(--sombra-m); }
  .no-existe .codigo{ font-family: var(--font-data); color: var(--muted-2); letter-spacing: .12em; margin-bottom: 6px; }
  .no-existe h1{ font-size: 1.6rem; margin-bottom: 10px; }
  .no-existe p{ color: var(--muted); margin-bottom: 22px; }
  .no-existe-acciones{ display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="no-existe">
  <div class="no-existe-caja">
    <img src="/iconos/app.svg" alt="">
    <p class="codigo">ERROR 404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido.
       Desde el inicio o tu panel llegas a todo lo demás.</p>
    <div class="no-existe-acciones">
      <a class="btn btn-primary" href="/login">Ir a mi panel</a>
      <a class="btn btn-outline" href="/">Página de inicio</a>
    </div>
  </div>
</main>
</body>
</html>
